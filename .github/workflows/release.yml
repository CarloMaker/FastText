# Crea FastText.exe su Windows e lo pubblica come Release.
# Si avvia quando invii un tag che inizia con "v" (es. git tag v1.3 && git push origin v1.3),
# oppure a mano da GitHub: Actions > "Crea exe e Release" > Run workflow (solo build, senza Release).

name: Crea exe e Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa le librerie
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Controllo rapido (i moduli si caricano)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import ftcore, ftsearch, fttextops, ftpanels, fasttext; print('ok', ftcore.APP_VERSION)"

      - name: Crea FastText.exe
        run: python -m PyInstaller --noconfirm --clean --windowed --name FastText --icon fasttext.ico --hidden-import ftcore --hidden-import ftsearch --hidden-import fttextops --hidden-import ftpanels fasttext.py

      - name: Prepara lo zip
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "build-${{ github.run_number }}" }
          Copy-Item LEGGIMI.txt, Esempio.ftx dist\FastText\
          Compress-Archive -Path dist\FastText -DestinationPath "FastText-$ver-win64.zip"
          "ZIP_NAME=FastText-$ver-win64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Conserva lo zip (scaricabile dalla pagina dell'esecuzione)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Pubblica la Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: FastText ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          body: |
            **Download:** scarica `${{ env.ZIP_NAME }}`, estrai la cartella e avvia `FastText.exe`.
            Non serve installare Python.

            Al primo avvio Windows potrebbe mostrare l'avviso di SmartScreen (l'exe non è firmato):
            clic su *Ulteriori informazioni* → *Esegui comunque*.
